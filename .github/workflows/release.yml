---
# GitHub workflow to Release the Artifact Signing Notation using a tag push.
name: Release notation-azure-artifactsigning plugin

on:
  push:
    tags:
      - 'v*'

# Contents write required for release PRs
permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        config:
          - runtime: osx-x64
            build_args: ""
            os: ubuntu-24.04
          - runtime: osx-arm64
            build_args: ""
            os: ubuntu-24.04
          - runtime: linux-x64
            build_args: ""
            os: ubuntu-24.04
          - runtime: linux-arm64
            build_args: ""
            os: ubuntu-24.04-arm
          - runtime: win-x64
            build_args: ""
            os: windows-2025
          - runtime: win-arm64
            build_args: ""
            os: windows-11-arm
    name: Build
    runs-on: ${{ matrix.config.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: '10.0.x'
      - name: Build .NET project
        shell: bash
        run: python3 ./scripts/build.py "${GITHUB_REF_NAME}" ${{ matrix.config.runtime }} ${{ matrix.config.build_args }}
      - name: Upload ${{ matrix.config.runtime }} artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ matrix.config.runtime }}
          path: ${{ github.workspace }}/bin/artifacts/*
          retention-days: 1
  release:
      name: Release
      runs-on: ubuntu-24.04
      needs: Build
      steps:
        - name: Checkout
          uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
          with:
            fetch-depth: 0
        - name: Download artifacts
          uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
          with:
            path: ${{ github.workspace }}/bin/artifacts
        - name: Create release
          env:
            GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          run: bash ./scripts/release.sh "${GITHUB_REF_NAME}"
